<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Skill Point - Technical Job Readiness Evaluation, Skill Gap Analysis & Adaptive Assessments" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('skillPointTheme') || 'system';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-color-mode', resolved);
          document.documentElement.style.colorScheme = resolved;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', resolved === 'dark' ? '#0b0f17' : '#0f172a');
          }
        } catch (e) {}
      })();
    </script>
    <title>Skill Point | Technical Job Readiness & Gap Analysis Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
